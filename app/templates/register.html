{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <i class="fa-solid fa-user-plus"></i>
            <h3>Student Registration</h3>
            <p>Create an account to submit and track your complaints.</p>
        </div>
        <form method="POST" action="{{ url_for('main.register') }}">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" name="username" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" required>
            </div>
            <button type="submit" style="margin-top: 10px;">Register</button>
        </form>
        <div class="register-link">
            <p>Already have an account? <a href="{{ url_for('main.login') }}">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
